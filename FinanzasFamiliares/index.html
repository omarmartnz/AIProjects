<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090D16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanzas" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Finanzas Familiares</title>
    <meta name="description" content="App para la gestión y control de finanzas familiares: presupuestos mensuales, categorización, etiquetas, alertas de límites, miembros de la familia, integración bancaria y sincronización en la nube con reportes PDF." />
    <meta property="og:title" content="Finanzas Familiares" />
    <meta property="og:description" content="App para la gestión y control de finanzas familiares: presupuestos mensuales, categorización, etiquetas, alertas de límites, miembros de la familia, integración bancaria y sincronización en la nube con reportes PDF." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #090D16; margin: 0; padding: 0;" class="bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-stone-100 font-sans antialiased transition-colors duration-200">
    <div id="root">
      <!-- Splash Screen inicial en Android y Web con gradiente idéntico al icono de la app -->
      <div id="initial-splash" style="position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #090D16; background: linear-gradient(135deg, #090D16 0%, #1E1B4B 50%, #064E3B 100%); color: #ffffff; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; z-index: 999999; overflow: hidden; margin: 0; padding: 0;">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center;">
          <div style="position: relative; width: 104px; height: 104px; display: flex; align-items: center; justify-content: center;">
            <div style="position: absolute; inset: -12px; border-radius: 36px; background: #4F46E5; opacity: 0.3; filter: blur(18px); animation: splashGlow 2.4s ease-in-out infinite alternate;"></div>
            <img src="/icon.svg" alt="Finanzas Familiares" width="104" height="104" style="position: relative; width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.7); display: block;" />
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #f8fafc; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">Finanzas Familiares</div>
            <div style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: #cbd5e1; background: rgba(255,255,255,0.08); padding: 5px 14px; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(8px);">
              <span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #34d399; box-shadow: 0 0 10px #34d399;"></span>
              <span>Cargando aplicación...</span>
            </div>
          </div>
        </div>
        <style>
          @keyframes splashGlow {
            0% { opacity: 0.2; transform: scale(0.95); }
            100% { opacity: 0.45; transform: scale(1.1); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
